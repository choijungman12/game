<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%8F%9E%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <title>노후의 땅을 찾아라 · 부동산 토지 퀴즈</title>
  <meta name="description" content="내일의 가치를 만드는 토지 투자, 이제 게임으로! 노후 대비 부동산·토지 퀴즈 게임" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/screens.css" />

  <!-- QR code (UMD global: qrcode) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

  <!-- Three.js is lazy-loaded by the team board module -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <!-- Ambient background scene (swapped per screen theme) -->
  <div id="bg-scene" class="bg-scene" aria-hidden="true">
    <div class="bg-sky"></div>
    <div class="bg-sun"></div>
    <div class="bg-hills"></div>
    <div class="bg-city"></div>
    <div class="bg-grid"></div>
  </div>

  <!-- App root: screens are rendered here by js/app.js -->
  <main id="app" class="app"></main>

  <!-- Global overlay layers -->
  <canvas id="fx-confetti" class="fx-confetti" aria-hidden="true"></canvas>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
